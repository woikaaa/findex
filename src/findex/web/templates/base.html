<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}findex — пошук по текстах{% endblock %}</title>
  <meta name="description" content="Пошук по корпусу текстів: булеві запити, ранжування BM25 і TF-IDF.">
  <style>
    :root {
      --bg: #faf8f5; --card: #ffffff; --ink: #1d1b2b; --muted: #6b6880;
      --line: #e7e3da; --accent: #4338ca; --accent-ink: #ffffff; --mark: #fde68a;
      --pill: #eef0ff; --danger: #b42318; --danger-bg: #fef3f2;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14131c; --card: #1d1c29; --ink: #ecebf5; --muted: #9a98b0;
        --line: #2c2b3d; --accent: #8b87ff; --accent-ink: #14131c; --mark: #6b5a12;
        --pill: #26244a; --danger: #fda29b; --danger-bg: #3a1a18;
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--ink); line-height: 1.55;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }
    header.top { padding: 28px 0 8px; }
    .brand { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; color: var(--ink); }
    .brand span { color: var(--accent); }
    .tagline { color: var(--muted); margin: 2px 0 0; }
    form.search { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 6px; }
    form.search input[type=search] {
      flex: 1 1 260px; min-width: 0; padding: 13px 16px; font-size: 1.05rem; color: var(--ink);
      background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    }
    form.search select {
      padding: 13px 12px; font-size: 0.95rem; color: var(--ink); background: var(--card);
      border: 1px solid var(--line); border-radius: 12px;
    }
    form.search button {
      padding: 13px 22px; font-size: 1rem; font-weight: 600; color: var(--accent-ink);
      background: var(--accent); border: 0; border-radius: 12px; cursor: pointer;
    }
    form.search button:hover { filter: brightness(1.08); }
    input:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible {
      outline: 3px solid var(--accent); outline-offset: 2px;
    }
    .hint { color: var(--muted); font-size: 0.9rem; margin: 4px 0 0; }
    .hint code, .examples a {
      background: var(--pill); border-radius: 6px; padding: 1px 7px; font-size: 0.88rem;
    }
    .examples { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
    .examples a { padding: 5px 12px; border-radius: 999px; }
    .summary { color: var(--muted); font-size: 0.92rem; margin: 20px 0 10px; }
    .result {
      background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      padding: 14px 18px; margin: 0 0 12px;
    }
    .result h2 { font-size: 1.1rem; margin: 0 0 4px; line-height: 1.35; }
    .meta { display: flex; gap: 10px; align-items: center; color: var(--muted); font-size: 0.82rem; }
    .pill { background: var(--pill); color: var(--accent); border-radius: 999px; padding: 1px 9px; font-weight: 600; }
    .snippet { margin: 8px 0 0; color: var(--ink); overflow-wrap: anywhere; }
    mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 2px; }
    .alert { background: var(--danger-bg); color: var(--danger); border-radius: 12px; padding: 12px 16px; margin: 16px 0; }
    .empty { text-align: center; color: var(--muted); padding: 40px 0; }
    nav.pages { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 22px 0; }
    nav.pages a, nav.pages span {
      min-width: 40px; text-align: center; padding: 8px 12px; border-radius: 10px;
      border: 1px solid var(--line); background: var(--card); color: var(--ink);
    }
    nav.pages span.cur { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
    nav.pages span.gap { border: 0; background: none; color: var(--muted); }
    article.doc { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px 22px 22px; margin: 14px 0; }
    article.doc h1 { font-size: 1.6rem; line-height: 1.25; margin: 18px 0 6px; }
    article.doc p { margin: 0 0 12px; overflow-wrap: anywhere; }
    footer.bottom { color: var(--muted); font-size: 0.82rem; padding: 26px 0 40px; text-align: center; }
    footer.bottom a { color: var(--muted); text-decoration: underline; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <a class="brand" href="/">find<span>ex</span></a>
      <p class="tagline">Пошук по текстах з булевими запитами та ранжуванням</p>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
    <footer class="bottom">
      {{ settings.corpus_note }}<br>
      findex {{ version }} · <a href="/api/docs">API</a> · <a href="/stats">статистика</a> · <a href="/health">стан</a>
    </footer>
  </div>
</body>
</html>
