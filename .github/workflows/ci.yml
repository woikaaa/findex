name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Встановити Python і залежності
        run: uv sync --python ${{ matrix.python-version }}
      - name: ruff (стиль)
        run: uv run ruff check .
      - name: ruff (форматування)
        run: uv run ruff format --check .
      - name: pyright (типи)
        run: uv run pyright
      - name: pytest
        run: uv run pytest --cov
      - name: "Бенчмарки (pytest-benchmark, пошук і збірка індексу)"
        if: matrix.python-version == '3.13'
        run: uv run pytest benchmarks --benchmark-only --benchmark-json=bench.json
      - name: Таблиця бенчмарків у підсумку запуску
        if: matrix.python-version == '3.13'
        run: uv run python benchmarks/summary.py bench.json >> "$GITHUB_STEP_SUMMARY"
      - name: Зберегти результати бенчмарків
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: bench-json
          path: bench.json
